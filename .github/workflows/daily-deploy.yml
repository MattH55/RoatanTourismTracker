name: Daily Roatan Tourism Tracker Update & Deploy

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # This is the key fix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static site (pages, robots.txt, sitemap.xml)
        run: python generate_static_site.py

      # Publish only the generated site, not the repo root (scripts, raw JSON, debug pages)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: roatantourismtracker.online
