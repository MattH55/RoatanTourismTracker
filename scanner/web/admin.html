<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Roatan Deals Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    #printArea { display: none; }
    @media print {
      @page { size: letter; margin: 0.5in 0.75in; }
      body { padding: 0; background: #fff; }
      main { display: none; }
      #printArea { display: grid; grid-template-columns: 3.5in 3.5in; grid-auto-rows: 2in; }
      .vcard {
        border: 1px dashed #999; padding: 0.14in; display: flex; gap: 0.12in; align-items: center;
        color: #111; font-family: Arial, sans-serif; break-inside: avoid;
      }
      .vcard .qr { width: 1.3in; height: 1.3in; flex: none; }
      .vcard .qr img, .vcard .qr canvas { width: 1.3in !important; height: 1.3in !important; }
      .vcard .brand { font-size: 15pt; font-weight: bold; color: #1f7a99; }
      .vcard .line { font-size: 8.5pt; margin-top: 3pt; }
      .vcard .code { font-size: 12pt; font-weight: bold; margin-top: 6pt; letter-spacing: 1px; }
      .vcard .small { font-size: 7pt; color: #555; margin-top: 4pt; }
      .vcard:nth-child(10n) { break-after: page; }
    }
  </style>
</head>
<body>
<main>
  <h1>Roatan Deals admin</h1>
  <div id="result"></div>

  <div class="panel">
    <h2>Admin key</h2>
    <label for="adminKey">From the Apps Script log after running setup()</label>
    <input id="adminKey" type="password" autocomplete="off">
    <button id="saveKey">Save on this device</button>
  </div>

  <div class="panel">
    <h2>Add driver</h2>
    <label for="dName">Name</label><input id="dName">
    <div class="row">
      <div><label for="dPhone">WhatsApp</label><input id="dPhone" inputmode="tel"></div>
      <div><label for="dShare">Share % (blank = default)</label><input id="dShare" type="number"></div>
    </div>
    <label for="dPay">Payout method (e.g. Tigo Money 9999-9999)</label><input id="dPay">
    <button data-op="addDriver">Add driver</button>
  </div>

  <div class="panel">
    <h2>Add business</h2>
    <label for="bName">Name</label><input id="bName">
    <label for="bOffer">Offer shown to staff and tourists</label><input id="bOffer" placeholder="Free tasting + 10% off over $20">
    <div class="row">
      <div><label for="bPct">Commission %</label><input id="bPct" type="number" value="12"></div>
      <div><label for="bFlat">+ Flat fee $</label><input id="bFlat" type="number" value="0"></div>
    </div>
    <button data-op="addBusiness">Add business</button>
    <div id="setupBox" class="hidden">
      <p class="muted">Scan this with the business's phone camera to set it up. It is shown once; keep it private.</p>
      <div class="qr-box"><div id="setupQr"></div></div>
      <p><code id="setupLink"></code></p>
    </div>
  </div>

  <div class="panel">
    <h2>Cards</h2>
    <label for="mintCount">Create new cards</label>
    <div class="row"><input id="mintCount" type="number" value="100"><button data-op="mintCards">Create</button></div>
    <label>Card range</label>
    <div class="row"><input id="from" type="number" placeholder="From 1001"><input id="to" type="number" placeholder="To 1100"></div>
    <label for="driverId">Assign range to driver ID</label>
    <div class="row"><input id="driverId" placeholder="D001"><button data-op="assignCards">Assign</button></div>
    <div class="row">
      <button data-op="cardsForPrint" class="secondary">Print range</button>
      <button data-op="voidCards" class="secondary">Void range</button>
    </div>
  </div>

  <div class="panel">
    <h2>Balances</h2>
    <p class="muted">Record driver payouts and business top-ups as rows in the Payouts and Topups sheets.</p>
    <button data-op="balances" class="secondary">Refresh balances</button>
    <div id="balances"></div>
  </div>
</main>
<div id="printArea"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { api, message, el } = Deals;
  const $ = id => document.getElementById(id);
  const val = id => $(id).value.trim();
  const base = new URL('.', location.href).href;  // the /r/ folder

  $('adminKey').value = Deals.adminKey();
  $('saveKey').onclick = async () => {
    Deals.adminKey(val('adminKey'));
    const r = await api('admin', { adminKey: val('adminKey'), op: 'ping' });
    show(r.ok ? 'ok' : 'bad', r.ok ? '✓ Key works' : '✗', r.ok ? '' : message(r.error));
  };

  function show(kind, big, detail) {
    $('result').replaceChildren(el('div', { class: 'result ' + kind },
      el('div', { class: 'big' }, big), detail ? el('div', { class: 'detail' }, detail) : ''));
    window.scrollTo(0, 0);
  }

  const payloads = {
    addDriver: () => ({ name: val('dName'), phone: val('dPhone'), sharePct: val('dShare'), payoutMethod: val('dPay') }),
    addBusiness: () => ({ name: val('bName'), offer: val('bOffer'), commissionPct: val('bPct'), commissionFlat: val('bFlat') }),
    mintCards: () => ({ count: val('mintCount') }),
    assignCards: () => ({ from: val('from'), to: val('to'), driverId: val('driverId').toUpperCase() }),
    voidCards: () => ({ from: val('from'), to: val('to') }),
    cardsForPrint: () => ({ from: val('from'), to: val('to') }),
    balances: () => ({}),
  };

  const handlers = {
    addDriver: r => show('ok', '✓ ' + r.driverId, `${r.name} added. Use ID ${r.driverId} when assigning cards.`),
    addBusiness: r => {
      const link = `${base}setup.html#k=${encodeURIComponent(r.accessKey)}`;
      $('setupLink').textContent = link;
      $('setupQr').replaceChildren();
      new QRCode($('setupQr'), { text: link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      $('setupBox').classList.remove('hidden');
      show('ok', '✓ ' + r.businessId, `${r.name} added. Set up their phone with the QR below.`);
    },
    mintCards: r => {
      $('from').value = r.from; $('to').value = r.to;
      show('ok', `✓ Cards ${r.from}–${r.to}`, 'Created. Print them, then assign the stack to a driver when you hand it over.');
    },
    assignCards: r => show('ok', `✓ ${r.assigned} cards → ${r.driver}`,
      `Valid until ${r.expires}.` + (r.skipped ? ` ${r.skipped} skipped (already used or void).` : '')),
    voidCards: r => show('ok', `✓ ${r.voided} cards voided`, ''),
    cardsForPrint: r => printCards(r.cards),
    balances: r => renderBalances(r),
  };

  document.querySelectorAll('button[data-op]').forEach(btn => {
    btn.onclick = async () => {
      const op = btn.dataset.op;
      btn.disabled = true;
      const r = await api('admin', { adminKey: Deals.adminKey() || val('adminKey'), op, ...payloads[op]() });
      btn.disabled = false;
      if (r.ok) handlers[op](r); else show('bad', '✗', message(r.error));
    };
  });

  function printCards(cards) {
    if (!cards.length) return show('bad', '✗', 'No cards in that range');
    const area = $('printArea');
    area.replaceChildren();
    cards.forEach(c => {
      const qr = el('div', { class: 'qr' });
      area.append(el('div', { class: 'vcard' }, qr, el('div', {},
        el('div', { class: 'brand' }, 'Roatan Deals'),
        el('div', { class: 'line' }, 'Show this card at any partner shop for your discount.'),
        el('div', { class: 'line' }, 'Muestre esta tarjeta en cualquier socio.'),
        el('div', { class: 'code' }, c.shortCode),
        el('div', { class: 'small' }, 'One use · Un solo uso'))));
      new QRCode(qr, { text: `${base}?c=${c.token}`, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.Q });
    });
    setTimeout(() => window.print(), 300);
  }

  function renderBalances(r) {
    const money = n => '$' + Number(n).toFixed(2);
    const table = (cols, rows) => el('table', {},
      el('tr', {}, cols.map(([label, , num]) => el('th', num ? { class: 'num' } : {}, label))),
      rows.map(row => el('tr', {}, cols.map(([, get, num]) => el('td', num ? { class: 'num' } : {}, get(row))))));
    $('balances').replaceChildren(
      el('h2', {}, 'Drivers – owed this payday'),
      table([['Driver', d => `${d.driverId} ${d.name}`], ['Scans', d => d.scans, 1],
             ['Earned', d => money(d.earned), 1], ['Paid', d => money(d.paid), 1], ['Owed', d => money(d.owed), 1]], r.drivers),
      el('h2', { style: 'margin-top:16px' }, 'Businesses – prepaid balance'),
      table([['Business', b => `${b.businessId} ${b.name}`], ['Free left', b => b.freeRemaining, 1],
             ['Topped up', b => money(b.toppedUp), 1], ['Charged', b => money(b.charged), 1],
             ['Balance', b => money(b.balance), 1]], r.businesses),
      el('p', { class: 'muted' }, `${r.flagged} redemption(s) flagged for review in the Redemptions sheet.`));
  }
})();
</script>
</body>
</html>
