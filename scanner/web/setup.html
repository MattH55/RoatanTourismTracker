<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Partner Phone Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Partner phone setup</h1>
  <div id="result"></div>
  <div class="panel">
    <p class="muted">Configuración del teléfono del socio. After setup, scanning a Roatan Deals card with this
      phone's camera opens the redeem screen for your business.</p>
    <button id="forget" class="secondary">Remove this phone / Quitar este teléfono</button>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { api, message, el, param } = Deals;
  const result = document.getElementById('result');
  const show = (kind, big, detail) => result.replaceChildren(
    el('div', { class: 'result ' + kind }, el('div', { class: 'big' }, big), el('div', { class: 'detail' }, detail)));

  const key = param('k') || Deals.businessKey();
  // Drop the key from the address bar so it isn't left in history or screenshots.
  if (location.hash) history.replaceState(null, '', location.pathname);

  if (!key) {
    show('info', 'Not set up', 'Ask Roatan Deals for your setup link / Pida su enlace de configuración');
  } else {
    const me = await api('whoami', { key });
    if (me.ok) {
      Deals.businessKey(key);
      show('ok', '✓ ' + me.business, 'This phone is ready to scan cards / Este teléfono está listo');
    } else {
      show('bad', '✗', message(me.error));
    }
  }
  document.getElementById('forget').onclick = () => {
    Deals.businessKey(null);
    show('info', 'Removed', 'This phone can no longer redeem cards / Este teléfono ya no puede canjear');
  };
})();
</script>
</body>
</html>
