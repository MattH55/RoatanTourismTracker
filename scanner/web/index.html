<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Roatan Deals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Roatan Deals</h1>
  <div id="result"></div>

  <!-- Partner business view -->
  <section id="bizView" class="hidden">
    <div class="panel">
      <div class="muted">Partner / Socio</div>
      <h2 id="bizName"></h2>
      <div class="muted" id="bizOffer"></div>
    </div>
    <div class="panel" id="redeemPanel">
      <label for="code">Card code / Código de tarjeta</label>
      <input id="code" autocomplete="off" autocapitalize="characters" placeholder="1001-K7QX">
      <label for="bill">Bill total after discount (US$) / Total de la cuenta</label>
      <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      <label for="staff">Staff name (optional) / Nombre del empleado</label>
      <input id="staff" autocomplete="off">
      <button id="redeemBtn">Redeem / Canjear</button>
    </div>
  </section>

  <!-- Tourist / anyone else view -->
  <section id="guestView" class="hidden">
    <div class="panel">
      <h2>Show this card to the cashier</h2>
      <p class="muted">Muestre esta tarjeta al cajero. Staff at partner shops scan it to apply your discount.</p>
      <div id="offersBox"></div>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { api, message, el, param } = Deals;
  const $ = id => document.getElementById(id);
  const code = param('c');
  const key = Deals.businessKey();

  function show(kind, big, detail) {
    $('result').replaceChildren(el('div', { class: 'result ' + kind },
      el('div', { class: 'big' }, big), detail ? el('div', { class: 'detail' }, detail) : ''));
  }

  if (key) {
    const me = await api('whoami', { key });
    if (me.ok) return businessView(me);
    if (me.error !== 'not_authorized') return show('bad', '⚠', message(me.error));
    Deals.businessKey(null);
  }
  guestView();

  async function businessView(me) {
    $('bizView').classList.remove('hidden');
    $('bizName').textContent = me.business;
    $('bizOffer').textContent = me.offer;
    if (code) {
      $('code').value = code.length > 12 ? 'Scanned card / Tarjeta escaneada' : code;
      $('code').dataset.code = code;
      $('code').readOnly = true;
      const card = await api('lookup', { code });
      if (!card.ok) show('bad', '⚠', message(card.error));
      else if (card.status !== 'valid') show('bad', '✗', message(card.status));
      else show('info', 'Card #' + card.cardNo, 'Enter the bill and press Redeem / Ingrese el total y presione Canjear');
    }
    $('redeemBtn').onclick = async () => {
      const c = $('code').dataset.code || $('code').value.trim();
      if (!c) return show('bad', '⚠', 'Enter the card code / Ingrese el código');
      $('redeemBtn').disabled = true;
      const r = await api('redeem', { key, code: c, bill: $('bill').value, staff: $('staff').value });
      $('redeemBtn').disabled = false;
      if (r.ok) {
        show('ok', '✓ VALID', `${r.offer} — Ref ${r.ref} · Card #${r.cardNo}`);
        $('redeemPanel').classList.add('hidden');
      } else {
        show('bad', '✗', message(r.error) + (r.when ? ` (${r.when})` : ''));
      }
      window.scrollTo(0, 0);
    };
  }

  async function guestView() {
    $('guestView').classList.remove('hidden');
    if (code) {
      const card = await api('lookup', { code });
      if (card.ok && card.status !== 'valid') show('bad', '✗', message(card.status));
    }
    const res = await api('offers');
    if (res.ok && res.offers.length) {
      $('offersBox').replaceChildren(el('h2', {}, 'Partner offers / Ofertas'),
        el('ul', { class: 'offers' }, res.offers.map(o => el('li', {}, el('strong', {}, o.name), ': ', o.offer))));
    }
  }
})();
</script>
</body>
</html>
